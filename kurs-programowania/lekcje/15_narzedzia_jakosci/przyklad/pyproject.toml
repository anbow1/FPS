[project]
name = "sklep"
version = "0.1.0"
description = "Przykładowy projekt do lekcji o narzędziach jakości."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# E/F: błędy i pyflakes, I: kolejność importów, B: typowe pułapki, UP: nowocześniejsza składnia.
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
