# Builds the games as Android APKs on every push to main (and on demand),
# uploads them as a workflow artifact, and publishes them on a rolling
# "android-latest" GitHub release so they can be downloaded straight to a phone.
#
# Tanks is always signed with its committed sideload key (android/app), so it
# updates the copy installed from the old anbow1/tanks releases.
#
# Optional stable signing: add repository secrets ANDROID_KEYSTORE_BASE64
# (base64 of a .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD. Without them each run signs with a fresh debug key,
# so uninstall the old app before installing a newer build.

name: Android APKs

on:
  push:
    branches: [main]
    paths:
      - 'field-line/**'
      - 'castaway-lagoon/**'
      - 'contrail/**'
      - 'ridgeline/**'
      - 'tanks/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apks
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: the APKs are signed with this run's debug key."
          fi

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: bash android/build-apks.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: android/out/*.apk
          if-no-files-found: error

      - name: Publish the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest android/out/field-line.apk android/out/castaway-lagoon.apk android/out/contrail.apk android/out/ridgeline.apk android/out/tanks.apk \
            --title "Android APKs (latest main)" \
            --notes "Built from ${GITHUB_SHA::7} by run ${GITHUB_RUN_NUMBER}. Install on Android 8+ (allow installs from this source). Landscape, on-screen touch controls; a Bluetooth keyboard also works." \
            --target "$GITHUB_SHA"
