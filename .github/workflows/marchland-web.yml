# Publishes Marchland on GitHub Pages at https://anbow1.github.io/FPS/marchland/ on every push to main
# that touches it (and on demand). From there it installs for offline play: on an iPad from Safari
# (Share → Add to Home Screen), on Android from Chrome (Install app), and the Windows shell
# (marchland/desktop, built by marchland-desktop.yml) opens it. A new version reaches every installed
# copy by itself: its service worker downloads only the files that changed (marchland/src/ui/offline.ts).
#
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: Deploy from a
# branch → gh-pages, / (root). The site is pushed to the gh-pages branch as a single commit (force-pushed,
# so the branch never grows): the account's Actions artifact storage is full, and a branch does not use it.

name: Marchland on the web

on:
  push:
    branches: [main]
    paths:
      - 'marchland/**'
      - '!marchland/desktop/**'
      - '.github/workflows/marchland-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marchland-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marchland/package-lock.json

      - name: Build
        working-directory: marchland
        run: |
          npm ci
          npm run build

      # The site: the game under marchland/, and the root sends a visitor there.
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r marchland/dist site/marchland
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=marchland/"><a href="marchland/">Marchland</a>\n' > site/index.html

      - name: Push the site to gh-pages
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Marchland from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
